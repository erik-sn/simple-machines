# template-managed (bootstrap): do not edit. Delete this line to take ownership.
# Static SPA serving with client-side routing fallback. The gateway routes
# /api to the backend Service; this container never proxies.

# Hashed assets cache forever. The entry document never does, so a deploy is
# picked up on the next navigation (main.tsx reloads once on a stale chunk).
# A map keeps every header at server level: add_header in a location block
# would drop the server-level ones.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Scripts, fonts, and API calls are same-origin (the gateway serves /api
    # on this host). style-src allows inline styles because data-driven values
    # reach the DOM as CSS variables on the style attribute
    # (style={{ "--x": v }} with bg-(--x)); scripts stay 'self' only.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
