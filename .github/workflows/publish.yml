# template-managed (bootstrap): do not edit. Delete this line to take ownership.
#
# Build once on main: every merge builds each component image exactly once and
# pushes the sha-<short> anchor tag plus the moving `edge` pointer (the alpha
# phase). Releases NEVER rebuild - promote.yml retags these digests, so the
# artifact that was tested is the artifact that ships (ADR 0009).
name: Publish images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read project facts
        id: facts
        run: |
          echo "slug=$(jq -r .slug project.json)" >> "$GITHUB_OUTPUT"
          echo "registry=$(jq -r .registry project.json)" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push components
        env:
          IMAGE_BASE: ${{ steps.facts.outputs.registry }}/${{ steps.facts.outputs.slug }}
          SHA_TAG: ${{ steps.facts.outputs.sha }}
        run: |
          set -euo pipefail
          for component in backend frontend; do
            if [ -d "$component" ]; then
              image="$IMAGE_BASE-$component"
              docker build -f "$component/Dockerfile" \
                --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                -t "$image:$SHA_TAG" -t "$image:edge" .
              docker push "$image:$SHA_TAG"
              docker push "$image:edge"
            fi
          done
