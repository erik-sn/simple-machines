# template-managed (bootstrap): do not edit. Delete this line to take ownership.
#
# Weekly full vulnerability scan of every lockfile (uv.lock, pnpm-lock.yaml,
# Cargo.lock) against OSV.dev, uploaded to GitHub code scanning. The backstop
# for transitive vulnerabilities that Renovate's alert feed (direct deps) can
# miss; fixes still arrive via Renovate's security fast lane or lockfile
# maintenance.
name: osv-scan

on:
  schedule:
    - cron: '31 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2
    with:
      scan-args: |-
        --recursive
        ./
