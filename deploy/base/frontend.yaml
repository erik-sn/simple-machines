# template-managed (bootstrap): do not edit; per-environment changes belong in
# overlays or the fleet repo. Delete this line to take ownership.
# Static SPA behind unprivileged nginx. Routing (HTTPRoute, hostnames, TLS)
# belongs to the fleet repo, never to the app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: ghcr.io/example/app-frontend:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          # Restricted-profile fields. readOnlyRootFilesystem is left out: the
          # unprivileged nginx image writes its pid and cache under /tmp; map
          # those to emptyDirs before enabling it.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
